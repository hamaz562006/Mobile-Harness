name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Pin matches app/build.gradle.kts ndkVersion = 28.2.13676358 (r28c).
      # Do not use `yes | sdkmanager` under pipefail: sdkmanager succeeds then
      # `yes` gets SIGPIPE and the step is wrongly treated as failed.
      - name: Install NDK 28.2.13676358
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$SDK_ROOT/ndk/28.2.13676358"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK already present"
            exit 0
          fi
          SM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager=$SM"
          # Accept licenses without pipefail noise
          set +e
          yes 2>/dev/null | "$SM" --sdk_root="$SDK_ROOT" --licenses >/tmp/sdk-licenses.log 2>&1
          set -e
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            set +e
            yes 2>/dev/null | "$SM" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" >/tmp/sdk-ndk.log 2>&1
            sm_rc=$?
            set -e
            # Success is determined by the installed tree, not sdkmanager exit code
            # (yes often exits 141 / broken pipe after sdkmanager closes stdin).
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK install OK (sdkmanager exit=$sm_rc)"
              tail -n 5 /tmp/sdk-ndk.log || true
              exit 0
            fi
            echo "NDK not ready yet (sdkmanager exit=$sm_rc); log tail:"
            tail -n 30 /tmp/sdk-ndk.log || true
            rm -rf "$NDK_DIR"
            sleep $((attempt * 5))
          done
          echo "Failed to install NDK after retries"
          exit 1

      # Online Edition (README): Core/Python/Android download when needed.
      # Shared asset matches upstream Online APK packaging (~89MB).
      - name: Download Online shared runtime asset
        run: |
          set -euo pipefail
          BASE="https://github.com/techjarves/Mobile-Harness/releases/download/runtime-2026.09.4"
          mkdir -p dist/runtime-bundles
          cd dist/runtime-bundles
          FILE="pocketdev-agy-arm64-2026.09.1.tar.zst"
          SHA="a659ab9188956fc4721ca86fb21b5118e0e489f47a5e02ae6b4f2fb423659d78"
          echo "Downloading $FILE ..."
          curl -fL --retry 5 --retry-delay 5 -o "$FILE" "$BASE/$FILE"
          echo "$SHA  $FILE" | sha256sum -c -
          ls -lh "$FILE"

      - name: Unit tests and online debug APK
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineDebug --stacktrace

      - name: Report APK size
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/online/debug/*.apk
          size=$(stat -c%s app/build/outputs/apk/online/debug/*.apk | head -n1)
          echo "APK bytes=$size"
          # Must not embed Core (~72MB); Online should land near upstream ~85–95MB debug.
          if [ "$size" -gt 110000000 ]; then
            echo "ERROR: Online APK is $size bytes — Core may have been embedded by mistake"
            exit 1
          fi
          if [ "$size" -lt 40000000 ]; then
            echo "ERROR: Online APK is only $size bytes — shared asset missing"
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 5
