name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Secrets are unavailable to fork pull requests. Those builds use the
      # runner's temporary debug key; trusted pushes and manual runs must use
      # the shared key so installed APKs remain update-compatible.
      - name: Configure stable debug signing
        if: github.event_name != 'pull_request'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64" || { echo "Missing DEBUG_KEYSTORE_BASE64"; exit 1; }
          test -n "$DEBUG_KEYSTORE_PASSWORD" || { echo "Missing DEBUG_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$DEBUG_KEY_PASSWORD" || { echo "Missing DEBUG_KEY_PASSWORD"; exit 1; }
          test -n "$DEBUG_KEY_ALIAS" || { echo "Missing DEBUG_KEY_ALIAS"; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/mh-debug-signing"
          mkdir -p "$SIGNING_DIR"
          chmod 700 "$SIGNING_DIR"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$SIGNING_DIR/debug.keystore"
          chmod 600 "$SIGNING_DIR/debug.keystore"
          echo "MH_DEBUG_STORE_FILE=$SIGNING_DIR/debug.keystore" >> "$GITHUB_ENV"
          echo "MH_DEBUG_STORE_PASSWORD=$DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MH_DEBUG_KEY_PASSWORD=$DEBUG_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "MH_DEBUG_KEY_ALIAS=$DEBUG_KEY_ALIAS" >> "$GITHUB_ENV"

      # Pin matches app/build.gradle.kts ndkVersion = 28.2.13676358 (r28c).
      # Do not use `yes | sdkmanager` under pipefail: sdkmanager succeeds then
      # `yes` gets SIGPIPE and the step is wrongly treated as failed.
      - name: Install NDK 28.2.13676358
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$SDK_ROOT/ndk/28.2.13676358"
          echo "SDK_ROOT=$SDK_ROOT"
          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "NDK already present"
            exit 0
          fi
          SM=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "sdkmanager=$SM"
          # Accept licenses without pipefail noise
          set +e
          yes 2>/dev/null | "$SM" --sdk_root="$SDK_ROOT" --licenses >/tmp/sdk-licenses.log 2>&1
          set -e
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            set +e
            yes 2>/dev/null | "$SM" --sdk_root="$SDK_ROOT" "ndk;28.2.13676358" >/tmp/sdk-ndk.log 2>&1
            sm_rc=$?
            set -e
            # Success is determined by the installed tree, not sdkmanager exit code
            # (yes often exits 141 / broken pipe after sdkmanager closes stdin).
            if [ -f "$NDK_DIR/source.properties" ]; then
              echo "NDK install OK (sdkmanager exit=$sm_rc)"
              tail -n 5 /tmp/sdk-ndk.log || true
              exit 0
            fi
            echo "NDK not ready yet (sdkmanager exit=$sm_rc); log tail:"
            tail -n 30 /tmp/sdk-ndk.log || true
            rm -rf "$NDK_DIR"
            sleep $((attempt * 5))
          done
          echo "Failed to install NDK after retries"
          exit 1

      # Online APK: no Core, no agent bundles embedded.
      - name: Unit tests and online debug APK
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineDebug --stacktrace

      - name: Report APK size
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/online/debug/*.apk
          size=$(stat -c%s app/build/outputs/apk/online/debug/*.apk | head -n1)
          echo "APK bytes=$size"
          # Online must not embed Core/agent runtime archives (download on demand).
          if unzip -l app/build/outputs/apk/online/debug/*.apk | grep -E '\.tar\.zst$'; then
            echo "ERROR: Online APK contains a .tar.zst runtime/agent bundle"
            unzip -l app/build/outputs/apk/online/debug/*.apk | grep -E 'assets/runtime|\.tar\.zst' || true
            exit 1
          fi
          echo "OK: no embedded runtime/agent .tar.zst"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-online-debug
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 5
